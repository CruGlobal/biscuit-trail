name: Build & Deploy ECS

on:
  # Parked v1 workflow — do not re-add push triggers. This app builds and
  # deploys through .github/workflows/pipeline-v2.yml. Dispatch-only, which
  # makes it an escape hatch during the window between merging this PR and the
  # companion infrastructure change being applied, and a historical record of
  # how the app used to ship after that: the production apply retires the
  # identity this build assumes, and from then on a dispatch here fails at the
  # build step. What still works afterwards is redeploying an image this
  # workflow already built, dispatched from the deploy repo by build number.
  #
  # Restoring the push trigger would double-build every merge and push v1's
  # environment-specific image tags alongside v2's candidates. The old
  # `staging` branch mapping is gone with it — there is no `staging` branch and
  # no `On Staging` label in the v2 flow.
  workflow_dispatch:
    # Allows manual build and deploy of any branch/ref
    inputs:
      auto-deploy:
        type: boolean
        description: Deploy image after building?
        required: true
        default: 'false'

jobs:
  # Build and push container image to ECR. Builds occur in the project repository.
  build:
    name: Build
    uses: CruGlobal/.github/.github/workflows/build-ecs.yml@v1

  # Triggers an ECS deployment in https://github.com/CruGlobal/cru-deploy/actions.
  # All deployments happen in the cru-deploy repo.
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name != 'workflow_dispatch' || github.event.inputs.auto-deploy == 'true'
    steps:
      - uses: CruGlobal/.github/actions/trigger-deploy@v2
        with:
          github-token: ${{ secrets.CRU_DEPLOY_GITHUB_TOKEN }}
          project-name: ${{ needs.build.outputs.project-name }}
          environment: ${{ needs.build.outputs.environment }}
          build-number: ${{ needs.build.outputs.build-number }}
